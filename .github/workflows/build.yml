name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Подпись своим ключом (если заданы секреты)
        env:
          KS: ${{ secrets.PC_KEYSTORE_B64 }}
          SP: ${{ secrets.PC_STORE_PASS }}
          KA: ${{ secrets.PC_KEY_ALIAS }}
          KP: ${{ secrets.PC_KEY_PASS }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "PC_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "PC_STORE_PASS=$SP" >> "$GITHUB_ENV"
            echo "PC_KEY_ALIAS=$KA" >> "$GITHUB_ENV"
            echo "PC_KEY_PASS=$KP" >> "$GITHUB_ENV"
            echo "Подписываю своим ключом"
            if keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$SP" -alias "$KA" > "$RUNNER_TEMP/ks.txt" 2>&1; then
              echo "::notice title=Ключ подписи::OK $(grep -o 'SHA-256.*' "$RUNNER_TEMP/ks.txt" | head -1)"
            else
              echo "::error title=Ключ подписи::не открывается, проверь секреты. $(head -c 200 "$RUNNER_TEMP/ks.txt" | tr '\n' ' ')"; exit 1
            fi
          else
            echo "Секретов нет: общий debug-ключ"
          fi

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Подпись готового APK
        run: |
          AS=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort | tail -1)
          "$AS" verify --print-certs app/build/outputs/apk/debug/*.apk | grep -i "SHA-256" | head -1 | sed 's/^/::notice title=Подпись APK::/'

      - name: Show build errors
        if: failure()
        run: |
          msg=$(grep -E "^e: |What went wrong|Caused by|error:|Could not|FAILURE" -A4 build.log | head -80 | cut -c1-400)
          msg="${msg//'%'/'%25'}"
          msg="${msg//$'\n'/'%0A'}"
          echo "::error title=Build errors::${msg}"

      - uses: actions/upload-artifact@v4
        with:
          name: PocketCode-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish release with APK
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/*.apk PocketCode.apk
          # Что изменилось с прошлой сборки: темы коммитов между прошлым релизом и этим
          PREV=$(gh release list --limit 1 --json tagName -q '.[0].tagName' || true)
          if [ -n "$PREV" ] && git rev-parse -q --verify "refs/tags/$PREV" >/dev/null; then
            RANGE="$PREV..HEAD"; FROM="с $PREV"
          else
            RANGE="-1"; FROM="(первая сборка в списке)"
          fi
          NOTES=$(git log $RANGE --no-merges --pretty='• %s' | grep -v -i -E 'ci:|\[skip' | head -40 | cut -c1-300)
          [ -z "$NOTES" ] && NOTES="• $(git log -1 --pretty=%s)"
          printf 'Что нового %s:\n%s\n' "$FROM" "$NOTES" > notes.txt
          gh release create "build-${{ github.run_number }}" PocketCode.apk \
            --title "Сборка ${{ github.run_number }}" \
            --notes-file notes.txt \
            --target "${{ github.sha }}"
          # оставляем только 10 последних релизов
          gh release list --limit 100 --json tagName -q '.[10:][].tagName' | xargs -r -I{} gh release delete {} --cleanup-tag -y
