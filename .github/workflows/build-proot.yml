name: Build proot (API 24)
on: workflow_dispatch
jobs:
  proot:
    runs-on: ubuntu-22.04
    steps:
      - name: Install NDK r23
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;23.2.8568313" >/dev/null
      - uses: actions/checkout@v4
      - name: Build
        run: |
          set +e
          bash -e -x .github/build_proot.sh > build.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then echo "::error::$(tail -n 22 build.log | cut -c1-220 | tr '\n' '~')"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: proot-api24
          path: out
