name: Build proot (API 24)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  proot:
    runs-on: ubuntu-22.04
    steps:
      - name: Install NDK r23
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;23.2.8568313" >/dev/null
      - uses: actions/checkout@v4
      - name: Python 2 for waf
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python2 || sudo apt-get install -y -qq python2-minimal
          sudo ln -sf /usr/bin/python2 /usr/local/bin/python
          python --version
      - name: Build
        run: |
          set +e
          bash -e -x .github/build_proot.sh > build.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then echo "::error::CFG $(find b/build -name config.log | head -1 | xargs -r sed -n '/accepts -fstack-protector/,$p' | grep -v '^\[\|^ *$' | head -n 40 | cut -c1-200 | tr '\n' '~')"; echo "::error::$(tail -n 8 build.log | cut -c1-220 | tr '\n' '~')"; exit 1; fi
      - name: Check process_vm_readv and commit libs
        run: |
          readelf --dyn-syms -W out/arm64-v8a/libproot.so | grep -q process_vm_readv || { echo "::error::NOVM CLANGS $(grep -o 'android[0-9]*-clang' build.log | sort | uniq -c | tr '\n' ' ') API $(grep -n 'API' b/config | cut -c1-120 | tr '\n' '~') CHK $(grep -n -B1 -A1 'check_process_vm.c' build.log | cut -c1-260 | head -8 | tr '\n' '~')"; exit 1; }
          cp out/arm64-v8a/* app/src/main/jniLibs/arm64-v8a/
          cp out/armeabi-v7a/* app/src/main/jniLibs/armeabi-v7a/
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add app/src/main/jniLibs
          git commit -m "proot: сборка с API 24 (process_vm_readv), чинит запуск Linux на новых телефонах" || true
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: proot-api24
          path: out
